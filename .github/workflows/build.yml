name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      flavor:
        description: '构建变体'
        required: true
        default: 'scoped'
        type: choice
        options: [ scoped, global ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 注入 Google Maps API Key（可选）
        run: |
          if [ -n "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
            echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > local.yml
          fi

      - name: 构建 Debug APK
        run: |
          # 1. 修复目录嵌套问题（如果存在子文件夹则自动进入）
          if [ -d "Simulated-Positioning-Motion" ]; then
            echo "检测到子目录，正在进入..."
            cd Simulated-Positioning-Motion
          fi
          
          # 2. 赋予 gradlew 执行权限
          chmod +x gradlew
          
          # 3. 自动补全可能缺失的 gradle-wrapper.jar
          echo "正在补全 Gradle Wrapper..."
          gradle wrapper --gradle-version 9.6.0
          
          # 4. 开始编译
          FLAVOR="${{ github.event.inputs.flavor || 'scoped' }}"
          TASK="assemble$(echo "${FLAVOR^}")Debug"
          echo "开始执行 ./gradlew $TASK"
          ./gradlew "$TASK" --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-${{ github.event.inputs.flavor || 'scoped' }}-debug
          # 使用 ** 匹配任意层级目录下的 APK
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: error