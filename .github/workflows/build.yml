name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      flavor:
        description: '构建变体'
        required: true
        default: 'scoped'
        type: choice
        options: [ scoped, global ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 注入 Google Maps API Key（可选）
        run: |
          if [ -n "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
            echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > local.yml
          fi

      - name: 赋予 gradlew 执行权限并自动补全 Wrapper
        run: |
          # 确保脚本可执行
          chmod +x gradlew
          
          # 自动生成或更新 Gradle Wrapper 到 9.6.0 版本
          # 这解决了之前因 AGP 版本过高导致的 "Minimum supported Gradle version is 9.5.0" 错误
          echo "正在配置 Gradle Wrapper..."
          gradle wrapper --gradle-version 9.6.0

      - name: 构建 Debug APK
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'scoped' }}"
          TASK="assemble$(echo "${FLAVOR^}")Debug"
          echo "开始执行 ./gradlew $TASK"
          # 添加 --stacktrace 参数，若失败可输出详细堆栈信息，便于排查
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-${{ github.event.inputs.flavor || 'scoped' }}-debug
          # 使用 ** 匹配任意层级目录下的 APK 文件，兼容项目嵌套或多模块结构
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
